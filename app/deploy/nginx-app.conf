# /etc/nginx/sites-available/zalihvat-app  (app.aksalex.com)
# ВНИМАНИЕ: это шаблон ТОЛЬКО для первичной установки. HTTPS/TLS-блок добавляет certbot
# прямо в боевой /etc/nginx/sites-available/zalihvat-app. Обычный деплой НЕ должен
# копировать этот файл поверх боевого - иначе затрётся TLS и сайт станет "Не защищено".
# После первичной установки: certbot --nginx -d app.aksalex.com  (добавит TLS-блок сам).
server {
    listen 80;
    server_name app.aksalex.com;

    root /var/www/zalihvat-app;
    index index.html;

    # заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # API -> uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    # Курс «Шажок» по коротким адресам (внутренний rewrite на /course/, URL не меняется)
    location = /step-by-step  { rewrite ^ /course/ last; }
    location = /step-by-step/ { rewrite ^ /course/ last; }
    location = /godmode  { rewrite ^ /course/ last; }
    location = /godmode/ { rewrite ^ /course/ last; }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
