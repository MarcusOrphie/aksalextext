<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Спасибо за оплату · Шажок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#faf5ec;--paper2:#fffdf8;--ink:#151210;--coral:#ff7f50;--coral-deep:#e85f2c;--line:#e7dcc8;--muted:#7b7168}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{max-width:440px;width:100%;text-align:center;background:var(--paper2);border:1.5px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:0 18px 50px rgba(21,18,16,.08)}
  .emoji{font-size:46px;line-height:1;margin-bottom:10px}
  h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:26px;margin:6px 0 10px}
  p{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 20px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.02em;color:#fff;background:var(--coral);border:none;border-radius:999px;padding:13px 26px;text-decoration:none;box-shadow:0 6px 18px rgba(255,127,80,.35)}
  .dots{margin-top:16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎉</div>
    <h1>Спасибо за оплату!</h1>
    <p>Доступ к курсу «Шажок» открыт. Сейчас перенесу тебя к первому шажку.</p>
    <a class="btn" id="go" href="/step-by-step">Открыть курс →</a>
    <div class="dots" id="dots">Переходим автоматически...</div>
  </div>
<script>
  // даём вебхуку Prodamus пару секунд проставить доступ, затем ведём на курс
  setTimeout(function(){ location.href = "/step-by-step"; }, 3000);
</script>
</body>
</html>
