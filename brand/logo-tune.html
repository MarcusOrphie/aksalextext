<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#faf5ec;display:flex;gap:10px;padding:20px}.c{background:#fffdf8;border:2px solid #151210;border-radius:12px;padding:8px}.c svg{height:230px;width:auto;display:block}.c div{font:600 12px sans-serif;text-align:center;margin-top:4px}</style>
<div id="root"></div>
<script>
const HEART='M0,40 C -22,15 -44,2 -44,-16 C -44,-34 -22,-40 -8,-26 C -3,-21 0,-15 0,-10 C 0,-15 3,-21 8,-26 C 22,-40 44,-34 44,-16 C 44,2 22,15 0,40 Z';
function mark(tx){
  return '<svg viewBox="'+(tx-46)+' 26 150 118"><path d="M95 36 L140 75 L95 114" fill="none" stroke="#151210" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>'+
  '<g transform="translate('+tx+',85) rotate(-90) scale(0.75)"><path d="'+HEART+'" fill="#ff7f50" stroke="#151210" stroke-width="3" stroke-linejoin="round"/></g></svg>';
}
const r=document.getElementById('root');
[60,63,66,69].forEach(tx=>{const c=document.createElement('div');c.className='c';c.innerHTML=mark(tx)+'<div>TX='+tx+' (точка x='+(tx+30)+')</div>';r.appendChild(c);});
</script>
