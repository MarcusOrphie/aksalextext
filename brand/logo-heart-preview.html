<!doctype html>
<meta charset="utf-8">
<title>Логотип · сердце-шеврон</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
  body{margin:0;background:#faf5ec;font-family:"Nunito",sans-serif;color:#151210;
    background-image:radial-gradient(rgba(255,127,80,.14) 1.1px,transparent 1.2px);background-size:16px 16px}
  .wrap{max-width:860px;margin:0 auto;padding:34px 20px 60px}
  h1{font-family:"Oswald";text-transform:uppercase;font-size:22px;letter-spacing:.04em;margin:0 0 4px}
  .sub{color:#7b7168;font-weight:700;font-size:14px;margin-bottom:26px}
  .card{background:#fffdf8;border:3px solid #151210;border-radius:20px;box-shadow:8px 8px 0 #151210;padding:26px 28px;margin-bottom:22px}
  .lbl{font-family:"Oswald";font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:#e85f2c;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .big svg{height:82px;width:auto;display:block}
  .dark{background:#151210;border-radius:12px;padding:14px 18px}
  .mini svg{height:40px;width:auto;display:block}
  .zoom svg{height:210px;width:auto;display:block;margin-top:16px}
  .note{font-size:13px;color:#7b7168;font-weight:700;margin-top:16px}
</style>
<div class="wrap">
  <h1>Логотип: сердце + сплошной шеврон, зазор</h1>
  <div class="sub">Как на референсе: плотное коралловое сердце с тёмной обводкой, сплошной скруглённый тёмный шеврон, аккуратный зазор между ними.</div>

  <div class="card">
    <div class="lbl">Итоговый вариант</div>
    <div class="row">
      <div class="big">
        <svg viewBox="0 0 580 150" role="img" aria-label="Залихват">
          <path d="M96 56 L126 86 L96 116" fill="none" stroke="#151210" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(56,86) rotate(-90) scale(0.82)"><path d="M0,40 C -22,15 -44,2 -44,-16 C -44,-34 -22,-40 -8,-26 C -3,-21 0,-15 0,-10 C 0,-15 3,-21 8,-26 C 22,-40 44,-34 44,-16 C 44,2 22,15 0,40 Z" fill="#ff7f50" stroke="#151210" stroke-width="6" stroke-linejoin="round"/></g>
          <g transform="skewX(-13)" font-family="Oswald,'Arial Black',sans-serif" font-weight="700" font-size="72" letter-spacing="0.5"><text x="154" y="112" fill="#151210">ЗАЛИХВАТ</text><text x="150" y="108" fill="#ff7f50" stroke="#151210" stroke-width="2.4" paint-order="stroke">ЗАЛИХВАТ</text></g>
        </svg>
      </div>
      <div class="dark mini">
        <svg viewBox="0 0 580 150" role="img" aria-label="Залихват">
          <path d="M96 56 L126 86 L96 116" fill="none" stroke="#faf5ec" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(56,86) rotate(-90) scale(0.82)"><path d="M0,40 C -22,15 -44,2 -44,-16 C -44,-34 -22,-40 -8,-26 C -3,-21 0,-15 0,-10 C 0,-15 3,-21 8,-26 C 22,-40 44,-34 44,-16 C 44,2 22,15 0,40 Z" fill="#ff7f50" stroke="#faf5ec" stroke-width="6" stroke-linejoin="round"/></g>
          <g transform="skewX(-13)" font-family="Oswald,sans-serif" font-weight="700" font-size="72" letter-spacing="0.5"><text x="152" y="110" fill="#ff7f50">ЗАЛИХВАТ</text></g>
        </svg>
      </div>
    </div>
    <div class="zoom">
      <svg viewBox="10 40 130 96" role="img" aria-label="знак">
        <path d="M96 56 L126 86 L96 116" fill="none" stroke="#151210" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(56,86) rotate(-90) scale(0.82)"><path d="M0,40 C -22,15 -44,2 -44,-16 C -44,-34 -22,-40 -8,-26 C -3,-21 0,-15 0,-10 C 0,-15 3,-21 8,-26 C 22,-40 44,-34 44,-16 C 44,2 22,15 0,40 Z" fill="#ff7f50" stroke="#151210" stroke-width="6" stroke-linejoin="round"/></g>
      </svg>
    </div>
    <div class="note">Слева — на светлом (как на сайте), справа — мини на тёмном (аватар/кабинет). Ниже — крупно только знак.</div>
  </div>
</div>
